<main>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12 text-center" style="color: #3f51b5;">
                <h1>Login</h1>
                <h4>Empowering Your Senses, Enhancing Your Life</h4>
            </div>
        </div>
        <div class="row mt-5">

            <div class="col-md-6">
                <img src="/assets/images/log1.gif" class="card-img-top" alt="..." style="width:100%;">
            </div>
            <div class="col-md-6">
                <form #lform="ngForm" (submit)="onsubmit(lform)" novalidate>
                  
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Enter Email</label>
                        <input type="email" class="form-control" name="txtemail" ngModel #txtemail="ngModel">
                        
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputPassword1" class="form-label">Password</label>
                        <input type="password" class="form-control" name="txtpwd"  ngModel #txtpwd="ngModel">
                    </div>
                    
                    <button type="submit" class="btn btn-primary">LOGIN</button>
                </form>
            </div>

        </div>
    </div>
</main>
